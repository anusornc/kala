# Story 46: publish to Clojars. Triggered by a version tag (v0.1.0 …):
# runs the behavioral matrix as a final gate, builds the release jar from
# the tag (RELEASE_VERSION), deploys with deps-deploy, and attaches the
# jar to a GitHub release. Credentials live in two repo secrets —
# CLOJARS_USERNAME and CLOJARS_PASSWORD (a Clojars deploy token); the
# io.github.anusornc group requires the Clojars account to have the
# GitHub username verified.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Behavioral matrix (final gate before publishing)
        run: clojure -M:test

      - name: Build release jar from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing $VERSION"
          RELEASE_VERSION="$VERSION" clojure -T:build jar
          echo "JAR_NAME=kala-$VERSION.jar" >> "$GITHUB_ENV"

      - name: Deploy to Clojars
        run: clojure -T:build deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}

      - name: Attach jar to a GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "target/$JAR_NAME" \
            --title "kala $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
