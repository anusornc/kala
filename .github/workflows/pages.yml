# GitHub Pages: the static snapshot explorer under site/ — a derived view
# of exported stores, no server (ADR-0012: the live monitor stays
# client-over-transactor; the site ships a pre-baked rendering instead).
# Data files are committed by site/export.clj, so a content change is an
# ordinary commit that rides this deploy.

name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
