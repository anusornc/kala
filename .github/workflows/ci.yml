name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.4.1474
      - name: Run the full test matrix ({peer, client} x {memory, file})
        run: clojure -M:test
