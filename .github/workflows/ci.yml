# Story 48: CI gate — the behavioral suite in both access modes (peer,
# client) across both storage backends (memory, file) — that is exactly
# what kala.test-runner runs — plus a bench cross-check smoke and the
# release jar build. Runner versions pin the environment the wave gates
# were verified against.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.5.1664

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-

      - name: Test matrix (peer + client x memory + file)
        run: clojure -M:test

      - name: Lint (clj-kondo — errors block; warnings are visible noise until swept)
        run: |
          clojure -Sdeps '{:deps {clj-kondo/clj-kondo {:mvn/version "2026.10.20"}}}' \
            -M -m clj-kondo.main --lint src test web --fail-level error

      - name: "Bench smoke (n=200) — gate: MATCH across 3 engines, both suites"
        run: |
          clojure -M:bench 200 > bench-smoke.txt 2>&1 || { cat bench-smoke.txt; exit 1; }
          clojure -M:bench-datomic --suite=datomic 200 > bench-smoke-datomic.txt 2>&1 || { cat bench-smoke-datomic.txt; exit 1; }
          cat bench-smoke.txt bench-smoke-datomic.txt
          grep -q "MATCH across 3 engines" bench-smoke.txt
          grep -q "MATCH across 3 engines" bench-smoke-datomic.txt

      - name: Web demo E2E (boots the server, drives every endpoint over HTTP)
        run: web/e2e.sh

      - name: Monitor E2E (the client-only graph app — scopes, drilldowns, follow, dead-transactor envelope)
        run: web/monitor-e2e.sh

      - name: Site export gate (clojure -M:site regenerates site/data; a drift fails the diff)
        run: |
          # The showcase store is recorded fresh at export time, so its
          # #inst values are wall-clock — scrub those, then require the
          # regenerated bytes to match what is committed. A change to the
          # derivation that is not accompanied by regenerated site data
          # fails here.
          cat > /tmp/norm-site-instants.py <<'PY'
          import json, sys

          def walk(v):
              if isinstance(v, str) and v.startswith("#inst"): return "#inst"
              if isinstance(v, list): return [walk(x) for x in v]
              if isinstance(v, dict): return {k: walk(x) for k, x in v.items()}
              return v

          sys.stdout.write(json.dumps(walk(json.load(open(sys.argv[1]))),
                                      separators=(",", ":")))
          PY
          cp site/data/showcase.json /tmp/committed-showcase.json
          cp site/data/trial-3b.json /tmp/committed-trial.json
          clojure -M:site
          python3 -I /tmp/norm-site-instants.py site/data/showcase.json > /tmp/fresh-showcase.json
          python3 -I /tmp/norm-site-instants.py /tmp/committed-showcase.json > /tmp/committed-showcase.norm.json
          python3 -I /tmp/norm-site-instants.py site/data/trial-3b.json > /tmp/fresh-trial.json
          python3 -I /tmp/norm-site-instants.py /tmp/committed-trial.json > /tmp/committed-trial.norm.json
          diff /tmp/fresh-showcase.json /tmp/committed-showcase.norm.json
          diff /tmp/fresh-trial.json /tmp/committed-trial.norm.json
          echo "site data matches the derivation"

      - name: Project E2E — transactor journey (SIGKILL crash-recovery over real processes)
        run: ./e2e.sh transactor

      - name: Project E2E — asserted demo walkthrough
        run: ./e2e.sh demo

      - name: Release jar (bench deps must stay out)
        run: clojure -T:build jar
